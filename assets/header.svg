<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Kamil Szostok — software engineer: .NET / C#, Next.js, T-SQL. ERP integrations and add-ons. Founder of KARQIS and Auspicon.">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">

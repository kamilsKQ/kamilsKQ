      <stop offset="0.55" stop-color="#0f1115" stop-opacity="1"/>
      <stop offset="1" stop-color="#0f1115" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="#0f1115"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="300" rx="18" fill="url(#fade)"/>

